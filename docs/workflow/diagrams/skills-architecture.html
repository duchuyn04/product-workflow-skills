<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấu trúc kỹ năng — Product Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; }
    main { width:min(1200px,96vw); padding:32px 24px; }
    h1 { margin:0; font:400 36px 'Instrument Serif',serif; }
    .dek { margin:8px 0 24px; color:var(--muted); font-size:14px; }
    svg { display:block; width:100%; height:auto; }
  </style>
</head>
<body>
<main>
  <h1>Cấu trúc kỹ năng — Product Workflow</h1>
  <p class="dek">Một router và ba kỹ năng theo cổng, cùng kỹ năng vẽ sơ đồ tùy chọn.</p>
  <svg viewBox="0 0 1140 376" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Cấu trúc 5 kỹ năng Product Workflow</title>
  <desc id="arch-desc">Bên yêu cầu gửi mô tả yêu cầu cho router product-workflow; router gọi lần lượt product-discovery ở Cổng G1, product-backlog ở Cổng G2 và sprint-planning ở Cổng G3; diagram-design là kỹ năng tùy chọn để vẽ story map hoặc dependency.</desc>
  <defs>
    <style>
      
      .tag { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#4f5d75; }
      .tag-accent { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#eb6c36; }
      .title { font:600 13px 'Geist',sans-serif; fill:#2d3142; }
      .skill { font:500 10px 'Geist Mono',monospace; fill:#4f5d75; }
      .detail { font:400 8px 'Geist Mono',monospace; fill:#7a8399; }
      .legend { font:500 8px 'Geist Mono',monospace; fill:#4f5d75; letter-spacing:.04em; }
      .eyebrow { font:500 9px 'Geist Mono',monospace; letter-spacing:.14em; fill:#2d3142; fill-opacity:.55; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7a8399"/></marker>
  </defs>
  <rect width="1140" height="376" fill="#f5f5f5"/>
    <line data-diagram-connector="user-router" x1="212" y1="102.0" x2="258" y2="102.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="router-discovery" x1="360.0" y1="140" x2="360.0" y2="194" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="router-backlog" x1="600.0" y1="140" x2="600.0" y2="194" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="router-planning" x1="840.0" y1="140" x2="840.0" y2="194" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="discovery-backlog" x1="460" y1="258.0" x2="498" y2="258.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="backlog-planning" x1="700" y1="258.0" x2="738" y2="258.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="planning-diagram" x1="940" y1="258.0" x2="978" y2="258.0" stroke="#7a8399" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
    <g data-diagram-node="user" transform="translate(40,64)">
      <rect width="172" height="76" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="172" height="76" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="42" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="33" y="20" text-anchor="middle">ACTOR</text>
      <text data-role="title" class="title" x="86" y="48" text-anchor="middle">Bên yêu cầu</text>
      <text class="skill" x="86" y="66" text-anchor="middle">mô tả yêu cầu</text>
    </g>
    <g data-diagram-node="router" transform="translate(260,64)">
      <rect width="680" height="76" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="680" height="76" rx="7" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect data-role="chip" x="12" y="10" width="48" height="14" rx="2" fill="#eb6c36" fill-opacity="0.2"/>
      <text class="tag-accent" x="36" y="20" text-anchor="middle">ROUTER</text>
      <text data-role="title" class="title" x="340" y="48" text-anchor="middle">product-workflow</text>
      <text class="skill" x="340" y="66" text-anchor="middle">định tuyến G1 → G2 → G3 · tiếp tục từ docs · thay đổi yêu cầu</text>
    </g>
    <g data-diagram-node="discovery" transform="translate(260,196)">
      <rect width="200" height="124" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="200" height="124" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="39" y="20" text-anchor="middle">CỔNG G1</text>
      <text data-role="title" class="title" x="100" y="48" text-anchor="middle">Nghiệp vụ &amp; Epic</text>
      <text class="skill" x="100" y="66" text-anchor="middle">product-discovery</text>
      <line x1="12" y1="76" x2="188" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">→ specs/&lt;du-an&gt;-brief.md</text>
    </g>
    <g data-diagram-node="backlog" transform="translate(500,196)">
      <rect width="200" height="124" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="200" height="124" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="39" y="20" text-anchor="middle">CỔNG G2</text>
      <text data-role="title" class="title" x="100" y="48" text-anchor="middle">Stories &amp; Backlog</text>
      <text class="skill" x="100" y="66" text-anchor="middle">product-backlog</text>
      <line x1="12" y1="76" x2="188" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">→ product-backlog.md</text>
    </g>
    <g data-diagram-node="planning" transform="translate(740,196)">
      <rect width="200" height="124" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="200" height="124" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="39" y="20" text-anchor="middle">CỔNG G3</text>
      <text data-role="title" class="title" x="100" y="48" text-anchor="middle">Sprint &amp; Tasks</text>
      <text class="skill" x="100" y="66" text-anchor="middle">sprint-planning</text>
      <line x1="12" y1="76" x2="188" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">→ sprints/…/sprint-plan.md</text>
    </g>
    <g data-diagram-node="diagram" transform="translate(980,196)">
      <rect width="124" height="124" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="124" height="124" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25" stroke-dasharray="4,3"/>
      <rect data-role="chip" x="12" y="10" width="60" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="42" y="20" text-anchor="middle">TÙY CHỌN</text>
      <text data-role="title" class="title" x="62" y="48" text-anchor="middle">Sơ đồ</text>
      <text class="skill" x="62" y="66" text-anchor="middle">diagram-design</text>
      <line x1="12" y1="76" x2="112" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">story map</text>
      <text class="detail" x="17" y="112">dependency</text>
    </g>
    <line x1="40" y1="352" x2="72" y2="352" stroke="#eb6c36" stroke-width="1.5"/>
    <text class="legend" x="80" y="355">luồng chính, dừng duyệt ở mỗi cổng</text>
    <line x1="300" y1="352" x2="332" y2="352" stroke="#7a8399" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text class="legend" x="340" y="355">tùy chọn, chỉ khi có yêu cầu sơ đồ</text>
</svg>

</main>
</body>
</html>
