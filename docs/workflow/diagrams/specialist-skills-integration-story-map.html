<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story map — Specialist skills integration</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,.12); --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; }
    main { width:min(1180px,96vw); padding:40px 24px 32px; }
    h1 { margin:0; font:400 38px 'Instrument Serif',serif; }
    .dek { margin:8px 0 26px; color:var(--muted); font-size:14px; }
    svg { display:block; width:100%; height:auto; }
    .eyebrow { font:500 8px 'Geist Mono',monospace; letter-spacing:.16em; fill:var(--muted); }
    .activity { font:600 13px 'Geist',sans-serif; fill:var(--ink); }
    .step { font:500 11px 'Geist',sans-serif; fill:var(--ink); }
    .slice { font:500 9px 'Geist Mono',monospace; letter-spacing:.16em; fill:var(--muted); }
    .story { font:600 12px 'Geist',sans-serif; fill:var(--ink); }
    .ticket { font:400 9px 'Geist Mono',monospace; fill:var(--muted); }
    .risk { font:600 7px 'Geist Mono',monospace; letter-spacing:.12em; fill:var(--accent); }
    .legend { font:400 9px 'Geist Mono',monospace; fill:var(--muted); }
    .note { margin:18px 0 0; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>Story map — Specialist skills integration</h1>
  <p class="dek">Một entry point, routing có điều kiện, specialist output có bằng chứng và review trước Done.</p>
  <svg viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
    <title id="title">Story map tích hợp ba specialist skills</title>
    <desc id="desc">Bốn hoạt động từ cài package đến hoàn thành an toàn, với bốn stories thuộc MVP.</desc>
    <rect width="1060" height="430" fill="#f5f5f5"/>

    <g aria-label="backbone">
      <g transform="translate(112,24)"><rect width="210" height="66" rx="6" fill="rgba(45,49,66,.05)" stroke="rgba(45,49,66,.24)"/><text class="eyebrow" x="17" y="20">ACTIVITY 1</text><text class="activity" x="16" y="45">Cài bộ skills</text></g>
      <g transform="translate(340,24)"><rect width="210" height="66" rx="6" fill="rgba(45,49,66,.05)" stroke="rgba(45,49,66,.24)"/><text class="eyebrow" x="17" y="20">ACTIVITY 2</text><text class="activity" x="16" y="45">Bắt đầu công việc</text></g>
      <g transform="translate(568,24)"><rect width="210" height="66" rx="6" fill="rgba(45,49,66,.05)" stroke="rgba(45,49,66,.24)"/><text class="eyebrow" x="17" y="20">ACTIVITY 3</text><text class="activity" x="16" y="45">Nhận hỗ trợ chuyên sâu</text></g>
      <g transform="translate(796,24)"><rect width="210" height="66" rx="6" fill="rgba(45,49,66,.05)" stroke="rgba(45,49,66,.24)"/><text class="eyebrow" x="17" y="20">ACTIVITY 4</text><text class="activity" x="16" y="45">Hoàn thành an toàn</text></g>
    </g>

    <g aria-label="walking skeleton">
      <g transform="translate(112,108)"><rect width="210" height="38" rx="4" fill="#fff" stroke="#2d3142"/><text class="step" x="16" y="24">Chạy installer một lần</text></g>
      <g transform="translate(340,108)"><rect width="210" height="38" rx="4" fill="#fff" stroke="#2d3142"/><text class="step" x="16" y="24">Gọi product-workflow</text></g>
      <g transform="translate(568,108)"><rect width="210" height="38" rx="4" fill="#fff" stroke="#2d3142"/><text class="step" x="16" y="24">Router chọn specialist</text></g>
      <g transform="translate(796,108)"><rect width="210" height="38" rx="4" fill="#fff" stroke="#2d3142"/><text class="step" x="16" y="24">Review evidence và Done</text></g>
    </g>

    <line x1="331" y1="100" x2="331" y2="326" stroke="rgba(45,49,66,.10)" stroke-width=".8" stroke-dasharray="4 4"/>
    <line x1="559" y1="100" x2="559" y2="326" stroke="rgba(45,49,66,.10)" stroke-width=".8" stroke-dasharray="4 4"/>
    <line x1="787" y1="100" x2="787" y2="326" stroke="rgba(45,49,66,.10)" stroke-width=".8" stroke-dasharray="4 4"/>

    <rect x="0" y="170" width="1060" height="140" fill="rgba(45,49,66,.02)"/>
    <text class="slice" x="24" y="196">MVP</text>

    <g aria-label="mvp stories">
      <g transform="translate(112,190)"><rect width="210" height="76" rx="4" fill="#fff" stroke="rgba(45,49,66,.30)"/><text class="story" x="16" y="28">Cài đủ ba specialist</text><text class="ticket" x="16" y="49">ST-SI-01 · hidden bundle</text></g>
      <g transform="translate(340,190)"><rect width="210" height="76" rx="4" fill="#fff" stroke="rgba(45,49,66,.30)"/><text class="story" x="16" y="28">Dùng một entry point</text><text class="ticket" x="16" y="49">ST-SI-02 · conditional route</text></g>
      <g transform="translate(568,190)"><rect width="210" height="76" rx="4" fill="#fff" stroke="rgba(45,49,66,.30)"/><text class="story" x="16" y="28">Nhận output đúng gate</text><text class="ticket" x="16" y="49">ST-SI-03 · diagnosis/design</text></g>
      <g transform="translate(796,190)"><rect width="210" height="76" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="164" y="8" width="34" height="15" rx="2" fill="rgba(235,108,54,.12)" stroke="#eb6c36"/><text class="risk" x="181" y="19" text-anchor="middle">RISK</text><text class="story" x="16" y="36">Review trước Done</text><text class="ticket" x="16" y="57">ST-SI-04 · spec + standards</text></g>
    </g>

    <line x1="24" y1="310" x2="1036" y2="310" stroke="#eb6c36" stroke-width="1.5"/>
    <rect x="936" y="299" width="100" height="18" fill="#f5f5f5"/>
    <text class="risk" x="1032" y="311" text-anchor="end">RELEASE CUT</text>

    <line x1="24" y1="352" x2="1036" y2="352" stroke="rgba(45,49,66,.12)"/>
    <g aria-label="legend">
      <rect x="112" y="376" width="24" height="14" rx="3" fill="#fff" stroke="rgba(45,49,66,.30)"/><text class="legend" x="146" y="387">MVP story</text>
      <rect x="330" y="376" width="24" height="14" rx="3" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-dasharray="4 4"/><text class="legend" x="364" y="387">Rủi ro cao nhất</text>
      <line x1="570" y1="383" x2="600" y2="383" stroke="#eb6c36" stroke-width="1.5"/><text class="legend" x="610" y="387">Release cut</text>
    </g>
  </svg>
  <p class="note">MVP chỉ gồm ba specialist đã duyệt; <code>research</code> nằm ngoài phạm vi.</p>
</main>
</body>
</html>
