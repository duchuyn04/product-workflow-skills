<svg viewBox="0 0 1140 256" role="img" aria-labelledby="gates-title gates-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="gates-title">Ba cổng duyệt từ mô tả yêu cầu đến sprint và task</title>
  <desc id="gates-desc">Mô tả yêu cầu đi qua Cổng G1 Nghiệp vụ và Epic, Cổng G2 Stories và Backlog, Cổng G3 Sprint và Tasks; mỗi cổng dừng chờ phê duyệt; kết quả là Product Backlog, roadmap, kế hoạch từng sprint và file CSV import Jira.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .tag { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#4f5d75; }
      .tag-accent { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#eb6c36; }
      .title { font:600 13px 'Geist',sans-serif; fill:#2d3142; }
      .skill { font:500 10px 'Geist Mono',monospace; fill:#4f5d75; }
      .detail { font:400 8px 'Geist Mono',monospace; fill:#7a8399; }
      .legend { font:500 8px 'Geist Mono',monospace; fill:#4f5d75; letter-spacing:.04em; }
      .eyebrow { font:500 9px 'Geist Mono',monospace; letter-spacing:.14em; fill:#2d3142; fill-opacity:.55; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7a8399"/></marker>
  </defs>
  <rect width="1140" height="256" fill="#f5f5f5"/>
    <rect x="16" y="20" width="1108" height="220" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity="0.12"/>
    <rect x="32" y="24" width="252" height="16" rx="2" fill="#ececec"/>
    <text class="eyebrow" x="36" y="35">PIPELINE 3 CỔNG · DUYỆT Ở MỖI CỔNG</text>
    <line data-diagram-connector="input-g1" x1="172" y1="134.0" x2="202" y2="134.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="g1-g2" x1="388" y1="134.0" x2="418" y2="134.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="g2-g3" x1="604" y1="134.0" x2="634" y2="134.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <line data-diagram-connector="g3-out" x1="820" y1="134.0" x2="850" y2="134.0" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arr)"/>
    <g data-diagram-node="input" transform="translate(32,52)">
      <rect width="140" height="164" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="140" height="164" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="39" y="20" text-anchor="middle">ĐẦU VÀO</text>
      <text data-role="title" class="title" x="70" y="48" text-anchor="middle">Mô tả yêu cầu</text>
      <text class="skill" x="70" y="66" text-anchor="middle">đề bài</text>
      <line x1="12" y1="76" x2="128" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">• Đề bài, PDF, Excel</text>
      <text class="detail" x="17" y="112">• Phỏng vấn</text>
      <text class="detail" x="17" y="130">• Tài liệu thật</text>
      <text class="detail" x="17" y="148">• Backlog có sẵn</text>
    </g>
    <g data-diagram-node="g1" transform="translate(204,52)">
      <rect width="184" height="164" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="184" height="164" rx="7" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#eb6c36" fill-opacity="0.2"/>
      <text class="tag-accent" x="39" y="20" text-anchor="middle">CỔNG G1</text>
      <text data-role="title" class="title" x="92" y="48" text-anchor="middle">Nghiệp vụ &amp; Epic</text>
      <text class="skill" x="92" y="66" text-anchor="middle">product-discovery</text>
      <line x1="12" y1="76" x2="172" y2="76" stroke="#eb6c36" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">• Chọn quy mô qua ask</text>
      <text class="detail" x="17" y="112">• As-Is → To-Be, actors</text>
      <text class="detail" x="17" y="130">• Danh mục Epic EP01…</text>
      <text class="detail" x="17" y="148">• Rules, phủ R1–R8</text>
    </g>
    <g data-diagram-node="g2" transform="translate(420,52)">
      <rect width="184" height="164" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="184" height="164" rx="7" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#eb6c36" fill-opacity="0.2"/>
      <text class="tag-accent" x="39" y="20" text-anchor="middle">CỔNG G2</text>
      <text data-role="title" class="title" x="92" y="48" text-anchor="middle">Stories &amp; Backlog</text>
      <text class="skill" x="92" y="66" text-anchor="middle">product-backlog</text>
      <line x1="12" y1="76" x2="172" y2="76" stroke="#eb6c36" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">• User Stories + AC</text>
      <text class="detail" x="17" y="112">• Ma trận Actor–Story</text>
      <text class="detail" x="17" y="130">• Priority · SP · Rank</text>
      <text class="detail" x="17" y="148">• Backlog theo Epic/Rank</text>
    </g>
    <g data-diagram-node="g3" transform="translate(636,52)">
      <rect width="184" height="164" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="184" height="164" rx="7" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#eb6c36" fill-opacity="0.2"/>
      <text class="tag-accent" x="39" y="20" text-anchor="middle">CỔNG G3</text>
      <text data-role="title" class="title" x="92" y="48" text-anchor="middle">Sprint &amp; Tasks</text>
      <text class="skill" x="92" y="66" text-anchor="middle">sprint-planning</text>
      <line x1="12" y1="76" x2="172" y2="76" stroke="#eb6c36" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">• Team size, velocity</text>
      <text class="detail" x="17" y="112">• Dependency, 5 tiêu chí</text>
      <text class="detail" x="17" y="130">• Sprint X – Mục tiêu</text>
      <text class="detail" x="17" y="148">• Bảng task T01…</text>
    </g>
    <g data-diagram-node="out" transform="translate(852,52)">
      <rect width="256" height="164" rx="7" fill="#f5f5f5"/>
      <rect data-role="box" width="256" height="164" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect data-role="chip" x="12" y="10" width="54" height="14" rx="2" fill="#2d3142" fill-opacity="0.08"/>
      <text class="tag" x="39" y="20" text-anchor="middle">KẾT QUẢ</text>
      <text data-role="title" class="title" x="128" y="48" text-anchor="middle">Kế hoạch sẵn sàng</text>
      <text class="skill" x="128" y="66" text-anchor="middle">docs/workflow/</text>
      <line x1="12" y1="76" x2="244" y2="76" stroke="#2d3142" stroke-opacity="0.15"/>
      <text class="detail" x="17" y="94">• product-backlog.md</text>
      <text class="detail" x="17" y="112">• sprints/roadmap.md</text>
      <text class="detail" x="17" y="130">• sprints/…/sprint-plan.md</text>
      <text class="detail" x="17" y="148">• jira-import.csv (tùy chọn)</text>
    </g>
</svg>
