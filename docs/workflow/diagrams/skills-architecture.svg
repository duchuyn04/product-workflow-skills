<svg viewBox="0 0 1140 650" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-title">Cấu trúc các kỹ năng Product Workflow</title>
  <desc id="arch-desc">Sơ đồ kiến trúc phân tầng thể hiện người dùng tương tác qua router product-workflow đến 4 cổng chất lượng tuần tự G1-G4, thực thi, nghiệm thu và các chuyên gia nội bộ theo trigger.</desc>
