      .zone { font:500 9px 'Geist Mono',monospace; letter-spacing:.14em; fill:#2d3142; fill-opacity:0.55; }
      .tag { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#4f5d75; }
      .tag-accent { font:600 8px 'Geist Mono',monospace; letter-spacing:.08em; fill:#eb6c36; }
      .node-title { font:600 13px 'Geist',sans-serif; fill:#2d3142; }
      .node-sub { font:400 9px 'Geist Mono',monospace; fill:#4f5d75; }
      .node-sub-detail { font:400 8px 'Geist Mono',monospace; fill:#7a8399; }
      .arrow-lbl { font:500 8px 'Geist Mono',monospace; fill:#4f5d75; letter-spacing:.03em; }
