<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dependency Graph — Specialist Skills Integration</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; }
    main { width:min(1220px,96vw); padding:40px 24px 32px; }
    h1 { margin:0; font:400 38px 'Instrument Serif',serif; }
    .dek { margin:8px 0 24px; color:var(--muted); font-size:14px; }
    svg { display:block; width:100%; height:auto; }
    .rank { font:500 8px 'Geist Mono',monospace; letter-spacing:.16em; fill:var(--soft); }
    .title { font:600 12px 'Geist',sans-serif; fill:var(--ink); }
    .sub { font:400 8px 'Geist Mono',monospace; fill:var(--muted); }
    .badge { font:500 8px 'Geist Mono',monospace; fill:var(--muted); }
    .note { margin:18px 0 0; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>Dependency Graph — Specialist Skills Integration</h1>
  <p class="dek">Năm task độc lập hội tụ vào packaging/integration, sau đó một bước kiểm chứng end-to-end.</p>
  <svg viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
    <title id="title">Dependency graph của bảy task tích hợp specialist skills</title>
    <desc id="desc">Task 01 đến 05 có thể chạy song song; Task 06 phụ thuộc cả năm; Task 07 phụ thuộc Task 06.</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
    <rect width="1080" height="540" fill="#f5f5f5"/>

    <text class="rank" x="18" y="38">RANK 0 · PARALLEL FRONTIER</text>
    <text class="rank" x="18" y="246">RANK 1 · INTEGRATION</text>
    <text class="rank" x="18" y="406">RANK 2 · VERIFICATION</text>

    <g fill="none" stroke="#4f5d75" stroke-width="1.15" marker-end="url(#arrow)">
      <path d="M120,116 V202 Q120,210 128,210 H484 Q492,210 492,218 V250"/>
      <path d="M330,116 V187 Q330,195 338,195 H508 Q516,195 516,203 V250"/>
      <line x1="540" y1="116" x2="540" y2="250"/>
      <path d="M750,116 V187 Q750,195 742,195 H572 Q564,195 564,203 V250"/>
      <path d="M960,116 V202 Q960,210 952,210 H596 Q588,210 588,218 V250"/>
      <line x1="540" y1="306" x2="540" y2="410"/>
    </g>

    <g aria-label="parallel tasks">
      <g transform="translate(40,60)"><rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/><rect x="118" y="8" width="32" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="134" y="18" text-anchor="middle">0 in</text><text class="title" x="16" y="28">Diagnosis skill</text><text class="sub" x="16" y="44">TASK-01</text></g>
      <g transform="translate(250,60)"><rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/><rect x="118" y="8" width="32" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="134" y="18" text-anchor="middle">0 in</text><text class="title" x="16" y="28">Design skill</text><text class="sub" x="16" y="44">TASK-02</text></g>
      <g transform="translate(460,60)"><rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/><rect x="118" y="8" width="32" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="134" y="18" text-anchor="middle">0 in</text><text class="title" x="16" y="28">Review skill</text><text class="sub" x="16" y="44">TASK-03</text></g>
      <g transform="translate(670,60)"><rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/><rect x="118" y="8" width="32" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="134" y="18" text-anchor="middle">0 in</text><text class="title" x="16" y="28">Router wiring</text><text class="sub" x="16" y="44">TASK-04</text></g>
      <g transform="translate(880,60)"><rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/><rect x="118" y="8" width="32" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="134" y="18" text-anchor="middle">0 in</text><text class="title" x="16" y="28">Review gate</text><text class="sub" x="16" y="44">TASK-05</text></g>
    </g>

    <g aria-label="integration task" transform="translate(460,250)">
      <rect width="160" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
      <rect x="116" y="8" width="34" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="133" y="18" text-anchor="middle">5 in</text>
      <text class="title" x="16" y="28">Package + tests</text><text class="sub" x="16" y="44">TASK-06 · owner</text>
    </g>

    <g aria-label="verification task" transform="translate(460,410)">
      <rect width="160" height="56" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <rect x="116" y="8" width="34" height="14" rx="2" fill="rgba(45,49,66,.06)" stroke="rgba(45,49,66,.20)"/><text class="badge" x="133" y="18" text-anchor="middle">1 in</text>
      <text class="title" x="16" y="28">Integrated verify</text><text class="sub" x="16" y="44">TASK-07 · evidence</text>
    </g>

    <text class="sub" x="18" y="516">A → B nghĩa B cần output của A · graph không có cycle · chưa assign owner/capacity</text>
  </svg>
  <p class="note">TASK-06 là điểm fan-in duy nhất; không chạy integration tests trước khi năm nguồn đầu vào hoàn tất.</p>
</main>
</body>
</html>
